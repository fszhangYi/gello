[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gello-host"
version = "0.1.0"
description = "Standalone Gello (Dynamixel leader) test host — PyQt + Web, on hik-sensors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "PyQt5>=5.15",
]

[project.optional-dependencies]
hardware = ["dynamixel-sdk>=3.7", "pyserial>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
gello = "gello_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gello_app = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
